{% load i18n %}
<div
  x-data="{ open: false }"
  x-on:open-modal.window="if ($event.detail === '{{ id }}') open = true"
  x-on:keydown.escape.window="open = false"
  x-cloak
>
  <div
    x-show="open"
    x-transition.opacity
    class="fixed inset-0 z-70 flex items-center justify-center p-4"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title-{{ id }}"
  >
    <div class="absolute inset-0 bg-base-100/70 backdrop-blur-sm" @click="open = false"></div>

    <div
      x-show="open"
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="opacity-0 scale-95"
      x-transition:enter-end="opacity-100 scale-100"
      class="glass-card shadow-soft-lg relative z-10 w-full max-w-lg {{ class|default:'' }}"
      @click.stop
    >
      <div class="flex items-start justify-between gap-4 border-b border-base-content/8 p-5">
        <h3 id="modal-title-{{ id }}" class="text-h3">{{ title }}</h3>
        <button type="button" class="icon-btn" @click="open = false" aria-label="{% trans 'Close' %}">
          {% include "components/ui/icon.html" with name="close" size="sm" %}
        </button>
      </div>
      <div class="p-5 text-body text-muted">
        {% if body_html %}{{ body_html|safe }}{% else %}{{ body }}{% endif %}
      </div>
    </div>
  </div>
</div>
