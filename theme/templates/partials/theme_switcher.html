{% load i18n %}

<button
    type="button"
    class="theme-toggle icon-btn"
    aria-label="{% trans 'Toggle color theme' %}"
    title="{% trans 'Toggle theme' %}"
>
    <span data-theme-icon="sun" class="hidden" aria-hidden="true">
        {% include "components/ui/icon.html" with name="sun" size="sm" %}
    </span>
    <span data-theme-icon="moon" aria-hidden="true">
        {% include "components/ui/icon.html" with name="moon" size="sm" %}
    </span>
</button>
